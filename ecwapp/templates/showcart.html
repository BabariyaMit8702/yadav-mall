<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Payment Form</title>
    <style>
        a:hover {
            color: rgba(207, 247, 5, 0.4);
        }

        a:active {
            color: red;
        }
        h2{
            color:#feffff;
        }
        .box{
            width: 300px;
            height: 40px;
            border: 2px solid black;
            border-radius: 10px;
        }
        .box1{
            width: 400px;
            height: 80px;
            border: 2px solid black;
            border-radius: 10px;
        }
        .addresslebel{
            position: relative;
            bottom: 40px;
        }
        .submitbtn{
            height: 40px;
            width: 100px;
            border: black solid 2px;
            border-radius: 10px;
            transition: transform 0.5s ease-in;
        }
        .submitbtn:hover{
            transform: scale(0.8);
        }
        #citems{
            color: black;
            font-size: larger;
        }
        #payment{
            height: 30px;
            border: solid 2px black;
        }
        h2{
            color: black;
        }
        .my_table{
            border: 1;
            border-radius: 5px;
            color:honeydew;
            background-color: rgb(14, 34, 34);
        }
    </style>
</head>
{% load static %}
<body style="color: black; background-image: url({% static 'images/e-commerce-background.jpg' %}); background-repeat: repeat; background-size: 1400px auto; position: relative; top: 0px;">
  <a style="font-size: larger;" href="/"><button class="submitbtn">🏠 HOME</button></a>
    <center>
        <p style="display: inline-block; width: auto;" id="citems" style="color: white;">Please add your favourite product in cart 
<a href="/">🏠</a>
        </p>
        <!---->
        
        <h2>FILL THIS FORM TO ORDER ITEMS WHICH IS IN CART</h2><br>

        <form action="/reod/" method="post" target="_self">
            {% csrf_token %}
            
            <input type="hidden" name="selected_items" value="is coming soon" id="selected_items">
            <input type="hidden" name="total_amount" value="will soon" id="total_amount">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter yout name" class="box"><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your contect No" class="box" required><br><br>

            <label class="addresslebel" for="address">Address:</label>
            <textarea id="address" name="address" class="box1" placeholder="Enter your parmanent address" rows="4" cols="40"
                required></textarea><br><br>

            <label>City Name:</label>
            <input type="text" name="CT" id="city_name" class="box" placeholder="Enter your city name" required><br><Br>

            <label>pin/zip code:</label>
            <input type="number" name="zip_code" class="box" id="zip_code" placeholder="pin code" required><br><br>

            <label for="payment">Payment Method:</label><br>
            <select id="payment" name="payment" required onchange="thefunc(this.value)">
                <option value="">--Select Payment Method--</option>
                <option value="upi">UPI</option>
                <option value="cash_on_delivery">Cash on Delivery</option>
            </select><br><br>

            <div>
                Total Price: Rs. <span id="total-price"></span>
            </div>
            <br>

            <input class="submitbtn" id="sb" type="submit" value="Order Now">
        </form>
    </center>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let discount = 0;
        function thefunc(mtd) {
            if(mtd=='upi'){
                discount = 5;
            }else{
                discount = 0;
            }
                updatet();
            }

        if (localStorage.getItem('cart') == null) {
            cart = {};
        }
        else {
            fetched_cart = JSON.parse(localStorage.getItem('cart'));
            cart = JSON.stringify(fetched_cart);
            // document.getElementById("citems").innerText = cart
            let table = document.createElement('table');
            table.border = '1';
            table.classList.add('my_table');
            let head = document.createElement('th');
            let header = table.createTHead();
            let headerRow = header.insertRow();
            let th1 = document.createElement('th');
            th1.textContent = 'PRODUCT NAME';
            let th2 = document.createElement('th');
            th2.textContent = 'PRICE';
            let th3 = document.createElement('th');
            th3.textContent = 'QUANTITY';
            headerRow.appendChild(th1);
            headerRow.appendChild(th2);
            headerRow.appendChild(th3);

            for(key in fetched_cart){
                let part = key.split('|| Rs.');
                let prod_name = part[0].trim();
                let prod_price = part[1].trim();
                let prod_quantity = fetched_cart[key];

                let myrow = table.insertRow();
                let cell1 = myrow.insertCell();
                let cell2 = myrow.insertCell();
                let cell3 = myrow.insertCell();
                cell1.textContent = `${prod_name}`;
                cell2.textContent = `${prod_price}`;
                cell3.textContent = `${prod_quantity}`;
            }
            
            document.getElementById("citems").innerHTML = "";
            document.getElementById("citems").appendChild(table);
            document.getElementById("selected_items").value = cart

        }

        let cartData = JSON.parse(localStorage.getItem('cart'));
        function updatet(){
        let total = 0;

        for (let key in cartData) {
            let quantity = cartData[key];

            let parts = key.split('|| Rs. ');
            if (parts.length === 2) {
                let price = parseFloat(parts[1]); // Convert string to float (in case decimal)
                total += price * quantity;
                localStorage.setItem('cart_total', JSON.stringify(total));
            }
                let l_total = JSON.parse(localStorage.getItem('cart_total'));
                if(discount==5){
                    let pers = (l_total * discount) / 100;
                    let fvl = l_total - pers;
                    l_total = fvl;
                }
                document.getElementById('total-price').innerHTML = l_total;
                document.getElementById('total_amount').value = Math.ceil(l_total);
            
        }
    }
    updatet();
               
        $("#sb").click(function () {
            localStorage.clear();
            location.reload();
        })

    </script>

</body>

</html>
