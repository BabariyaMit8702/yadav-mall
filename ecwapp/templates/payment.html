<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, initial-scale=1.0 maximum-scale=1.0">

  <title>Pay with GPay</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'ecwapp\css\payment.css' %}">
</head>

<body>
  <div class="container">
    <div id="and">
    <h2>Scan and Pay</h2>
    <p>Amount: ₹{{ amount }}</p>
    <p>Transaction ID: {{ txn_id }}</p>
</div>

    <img src="data:image/png;base64,{{ qr_img }}" alt="Scan to Pay">
    <br><Br><br>
      <div id="or">
    <p>Enter your Details to Verify:</p>
    <form action="/verify/" method="POST">
      {% csrf_token %}
      <br>
      <label for="text">Enter Transaction ID which You can show onside of QR:-</label><br>
      <input type="text" name="trn_id" id="trn_id" required>
      <br>
      <label for="text">Enter Your txn id from your payment history:-</label><br>
        <input type="text" name="txn" id="txn" required>
      <br>
      <label for="text">Enter Your Name which You was used in order Form:-</label><br>
        <input type="text" name="full name" id="the_name" required>
      <br>
      <br>
      <button type="submit">
        Verify
      </button>
      </form>
</div>
  </div>
</body>

</html>
