<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'ecwapp/css/update_profile.css' %}">
</head>
<body>
  
  <div class="container">
    <a href="/app/profile/" class="pr">
      GO BACK
    </a>
    <h2>Edit Profile</h2>
    <form id="the_form">
      <div>
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
      </div>

      <div>
        <label for="phone">Phone No</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
      </div>

      <div>
        <label for="profile_pic">Profile Picture</label>
        <div class="upload-field">
          <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
        </div>
      </div>

      <button type="submit" class="btn" id="btn">Update Profile</button>
    </form>
  </div>
  <script src="{% static 'ecwapp/js/update_profile.js' %}"></script>
</body>
</html>
