<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, initial-scale=1.0 maximum-scale=1.0">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
    integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">
  <title>The Product</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'ecwapp\css\productview.css' %}">
</head>

<body class="animated-bg">

  <div class="my-4 myfl">
    <div class="l">
      <img src="/media/{{currunt_product.image}}" width="auto" ; height="400px"
        style="border: 2px solid rgb(16, 132, 234); border-radius: 5%;">

      <br><br><br><Br>
      <a class="btn" href="/">Go Back To Home 🏠</a>
      <br>
    </div>

    <div class="r">
      <h3 id="h3" style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">
        {{currunt_product.product_name}}</h3>
      <p style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">RS. {{currunt_product.price}}
      </p>
      <p class="p" style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">
        descriptions: {{ currunt_product.desc }}
      </p>
    <BR><BR><br>
    <div id="review">
      <h3>REVIEWS</h3>
      <BR>
      <form action="" method="post" id="form">
        {% csrf_token %}
        <input type="text" placeholder="Tell about this product" name="review" value="" required oninput="changes()" id="review_input">
        <button type="submit" id="submitbtn">Add</button>
      </form>
      <div id="allrevs">
        <ul style="list-style: none;" id="ul_list">
        </ul>
      </div>
    </div>
    <br><br><br><br><br>
  </div>
  </div>


  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="{% static 'ecwapp\js\productview.js' %}"></script>






  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"
    integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
    integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
    crossorigin="anonymous"></script>


</body>

</html>
