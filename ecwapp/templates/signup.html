<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'ecwapp/css/signup.css' %}">
</head>

<body>

    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-warning alert-dismissible fade show" id="closediv" role="alert" style="text-align: center;">
        <strong>{{ msg }}</strong>
        <button type="button" class="btn-close" id="closebtn" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}


    <div id="thewrap">
        <div class="signup-form">
            <h2>Create Account</h2>
            <form action="/app/signup-process/" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password again</label>
                    <input type="password" class="form-control" id="password2" name="password2" required>
                    <div id="password-error" class="text-danger mt-1" style="display: none;">
                        Passwords do not match.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 clr">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="{% static 'ecwapp/js/signup.js' %}"></script>

</body>

</html>
